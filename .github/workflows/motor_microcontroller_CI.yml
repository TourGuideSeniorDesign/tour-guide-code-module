name: Motor Microcontroller CI

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths:
      - "firmware/motor_microcontroller/**"
      - "firmware/shared/**"
      - "src/autogiro_interfaces/**"
  pull_request:
    branches:
      - "**"
    paths:
      - "firmware/motor_microcontroller/**"
      - "firmware/shared/**"
      - "src/autogiro_interfaces/**"

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name

    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
            firmware/motor_microcontroller/.pio/libdeps
            firmware/motor_microcontroller/.pio/build
          key: ${{ runner.os }}-pio-motor-${{ hashFiles('firmware/motor_microcontroller/platformio.ini', 'src/autogiro_interfaces/msg/**') }}
          restore-keys: |
            ${{ runner.os }}-pio-motor-
            ${{ runner.os }}-pio-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO Core
        run: |
          python -m venv ~/.platformio/penv
          ~/.platformio/penv/bin/pip install platformio
          echo "$HOME/.platformio/penv/bin" >> $GITHUB_PATH
      - name: Copy custom ROS interfaces
        run: |
          mkdir -p firmware/motor_microcontroller/extra_packages
          cp -r src/autogiro_interfaces firmware/motor_microcontroller/extra_packages/
      - name: Build PlatformIO Project
        run: pio run -e ROS
        working-directory: firmware/motor_microcontroller
      - name: Set firmware filename
        id: firmware
        run: |
          timestamp=$(date -u +'%Y%m%d-%H%M%S')
          short_sha=${GITHUB_SHA::7}
          echo "filename=motor-${timestamp}-${short_sha}.uf2" >> "$GITHUB_OUTPUT"
      - name: Rename firmware
        run: cp .pio/build/ROS/firmware.uf2 "${{ steps.firmware.outputs.filename }}"
        working-directory: firmware/motor_microcontroller
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.firmware.outputs.filename }}
          path: firmware/motor_microcontroller/${{ steps.firmware.outputs.filename }}
          if-no-files-found: warn
